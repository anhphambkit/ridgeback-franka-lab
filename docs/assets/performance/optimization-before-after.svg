<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ridgeback Franka performance before and after optimization</title>
  <desc id="desc">The runtime GLB falls from 11.09 to 2.89 megabytes, geometry count falls from 26 to 15, while draw calls and triangle count remain unchanged.</desc>
  <rect width="1200" height="620" fill="#091310"/>
  <text x="60" y="68" fill="#eff8f2" font-family="Arial, sans-serif" font-size="30" font-weight="700">Optimization impact</text>
  <text x="60" y="100" fill="#789389" font-family="Arial, sans-serif" font-size="16">Measured with one articulated robot in the same desktop viewport</text>
  <rect x="60" y="140" width="520" height="190" rx="8" fill="#10211b" stroke="#294139"/>
  <text x="88" y="178" fill="#d9ff68" font-family="Arial, sans-serif" font-size="15" font-weight="700">RUNTIME GLB</text>
  <text x="522" y="178" text-anchor="end" fill="#75efb0" font-family="Arial, sans-serif" font-size="15" font-weight="700">74% smaller</text>
  <text x="88" y="220" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">Before</text>
  <rect x="160" y="202" width="360" height="24" rx="3" fill="#496158"/>
  <text x="532" y="220" fill="#eff8f2" font-family="Arial, sans-serif" font-size="15">11.09 MB</text>
  <text x="88" y="274" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">After</text>
  <rect x="160" y="256" width="94" height="24" rx="3" fill="#d9ff68"/>
  <text x="266" y="274" fill="#eff8f2" font-family="Arial, sans-serif" font-size="15">2.89 MB</text>
  <rect x="620" y="140" width="520" height="190" rx="8" fill="#10211b" stroke="#294139"/>
  <text x="648" y="178" fill="#d9ff68" font-family="Arial, sans-serif" font-size="15" font-weight="700">REPORTED GEOMETRIES</text>
  <text x="1082" y="178" text-anchor="end" fill="#75efb0" font-family="Arial, sans-serif" font-size="15" font-weight="700">42% fewer</text>
  <text x="648" y="220" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">Before</text>
  <rect x="720" y="202" width="360" height="24" rx="3" fill="#496158"/>
  <text x="1092" y="220" fill="#eff8f2" font-family="Arial, sans-serif" font-size="15">26</text>
  <text x="648" y="274" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">After</text>
  <rect x="720" y="256" width="208" height="24" rx="3" fill="#d9ff68"/>
  <text x="940" y="274" fill="#eff8f2" font-family="Arial, sans-serif" font-size="15">15</text>
  <rect x="60" y="370" width="1080" height="168" rx="8" fill="#10211b" stroke="#294139"/>
  <text x="88" y="410" fill="#d9ff68" font-family="Arial, sans-serif" font-size="15" font-weight="700">VISUAL COMPLEXITY REMAINS STABLE</text>
  <text x="88" y="458" fill="#789389" font-family="Arial, sans-serif" font-size="13">DRAW CALLS</text>
  <text x="88" y="492" fill="#eff8f2" font-family="Arial, sans-serif" font-size="25" font-weight="700">15</text>
  <text x="144" y="491" fill="#789389" font-family="Arial, sans-serif" font-size="18">→</text>
  <text x="178" y="492" fill="#eff8f2" font-family="Arial, sans-serif" font-size="25" font-weight="700">15</text>
  <text x="410" y="458" fill="#789389" font-family="Arial, sans-serif" font-size="13">TRIANGLES</text>
  <text x="410" y="492" fill="#eff8f2" font-family="Arial, sans-serif" font-size="25" font-weight="700">109,766</text>
  <text x="530" y="491" fill="#789389" font-family="Arial, sans-serif" font-size="18">→</text>
  <text x="564" y="492" fill="#eff8f2" font-family="Arial, sans-serif" font-size="25" font-weight="700">109,766</text>
  <text x="850" y="456" fill="#75efb0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Meshopt improves transfer</text>
  <text x="850" y="482" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">and storage efficiency without</text>
  <text x="850" y="508" fill="#afc2ba" font-family="Arial, sans-serif" font-size="14">simplifying the articulated model.</text>
  <text x="60" y="584" fill="#526b61" font-family="Arial, sans-serif" font-size="13">Source: WebGLRenderer.info and production build output documented in PERFORMANCE.md</text>
</svg>
